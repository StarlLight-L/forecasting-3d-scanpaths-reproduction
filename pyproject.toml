[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egocentric-scanpaths"
version = "0.1.0"
description = "Independent reproduction of Forecasting 3D Scanpaths in Egocentric Video"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["scanpaths*"]

[tool.pytest.ini_options]
pythonpath = ["."]
